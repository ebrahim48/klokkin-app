name: klokkin_app
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+7

environment:
  sdk: ^3.7.0


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  go_router:
  flutter_svg: ^2.0.16
  lottie:
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.1
  pin_code_fields: ^8.0.1
  flutter_rating_bar: ^4.0.1
  flutter_staggered_animations: ^1.1.1
  shared_preferences: ^2.5.3
  get: ^4.6.6
  mime_type: ^1.0.1
  flutter_spinkit: ^5.2.1
  toastification:
  quickalert: ^1.1.0
  country_pickers: ^3.0.1
  video_player: ^2.10.0
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  file_picker: ^10.1.2
  record: ^6.1.1
  path_provider:
  flutter_audio_waveforms:
  camera:
  permission_handler:
  logger:
  path: ^1.8.3
  image_gallery_saver_plus: ^4.0.1
  internet_connection_checker_plus: ^2.5.2
  flutter_widget_from_html: ^0.15.2
  in_app_purchase: ^3.2.0
  youtube_player_flutter: ^9.1.1




  device_preview:


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner:
  flutter_gen_runner:
  flutter_launcher_icons:


flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  adaptive_icon_background: "#00A572"


flutter_gen:
  output: lib/global/custom_assets/
  line_length: 80
  integrations:
    flutter_svg: true
    lottie: true






flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/


  # example:
  fonts:
     - family: Roboto
       fonts:
         - asset: assets/fonts/Roboto-Bold.ttf
         - asset: assets/fonts/Roboto-Regular.ttf
